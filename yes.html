<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Quiz</title>
  <link rel="stylesheet" href="yes_styles.css">
</head>
<body>
  <main class="stage">
    <section class="panel" aria-label="Quiz panel">
      <div class="scorebar" id="scoreBar">Score: 0/4</div>

      <!-- ✅ Emoji shows ABOVE the card (not overlaying it) -->
      <div class="reactionEmojiWrap" id="reactionEmojiWrap" hidden aria-hidden="true">
        <div class="reactionEmoji" id="reactionEmoji">💖</div>
      </div>

      <!-- Quiz card -->
      <div class="card" id="quizCard">
        <div class="cardInner" id="cardInner">
          <h2 class="question" id="questionText"></h2>

          <!-- ✅ Question 3 image -->
          <div class="photoWrap" id="photoWrap" aria-hidden="true">
            <img class="photo" id="photo" src="florida2026.JPG" alt="Photo memory">
          </div>

          <div class="choices" id="choices"></div>
        </div>
      </div>

      <!-- ✅ Text comment shows BELOW the card (not overlaying it) -->
      <div class="reactionTextWrap" id="reactionTextWrap" hidden aria-hidden="true">
        <div class="reactionText" id="reactionText">Nice!</div>
      </div>

      <!-- End screen -->
      <div class="endcard" id="endCard" hidden>
        <div class="endtitle" id="endTitle"></div>
        <div class="endmsg" id="endMsg"></div>
        <button class="btnPrimary" id="restartBtn" type="button">Try Again</button>
      </div>
    </section>
  </main>

  <script src="yes_script.js"></script>
</body>
</html>
