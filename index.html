<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <section class="card" aria-label="Valentine card">
      <div class="message">
        <h1>
          <span class="name">Ashutosh,</span><br/>
          will you be my <span class="val">Valentine ?</span>
        </h1>

        <div class="hearts" aria-hidden="true">
          <span>💖</span>
        </div>
      </div>

      <div class="actions" id="actions">
        <button class="btn yes" id="yesBtn" type="button">YES</button>
        <button class="btn no" id="noBtn" type="button">NO</button>
      </div>

      <p class="hint">(* Try clicking NO.. LOL )</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
